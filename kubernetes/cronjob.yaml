apiVersion: batch/v1
kind: CronJob
metadata:
  name: log-rotator
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: rotator
              image: busybox:1.38
              command: ["/bin/sh", "/scripts/rotate_logs.sh"]
              env:
                - name: LOG_DIR
                  value: "/var/log"
                - name: LOG_FILE
                  value: "/var/log/application.log"
                - name: RETENTION_DAYS
                  value: "5"
              volumeMounts:
                - name: logs
                  mountPath: /var/log
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: logs
              persistentVolumeClaim:
                claimName: app-logs-pvc
            - name: script
              configMap:
                name: rotate-script-cm
                defaultMode: 0755
