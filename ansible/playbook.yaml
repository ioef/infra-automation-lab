---
- name: Deploy Self-Hosted Sentry
  hosts: sentry
  become: true

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        update_cache: true
        name:
          - ca-certificates
          - curl
          - git
          - python3-debian
        state: present

    - name: Create 16G swapfile if missing
      ansible.builtin.shell: |
        set -e
        fallocate -l 16G /swapfile
        chmod 600 /swapfile
        mkswap /swapfile
        swapon /swapfile
        echo '/swapfile none swap sw 0 0' >> /etc/fstab
      args:
        creates: /swapfile

    - name: Create APT keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker repository signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker APT repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_distribution_release }}"
        components: stable
        architectures: amd64
        signed_by: /etc/apt/keyrings/docker.asc
        state: present

    - name: Install Docker and Compose plugin
      ansible.builtin.apt:
        update_cache: true
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Clone getsentry/self-hosted
      ansible.builtin.git:
        repo: "https://github.com/getsentry/self-hosted.git"
        dest: "/opt/sentry"
        version: "26.11.0"

    - name: Run Sentry installer
      ansible.builtin.command: ./install.sh --skip-user-creation --no-report-self-hosted-issues
      args:
        chdir: "/opt/sentry"
      async: 3600
      poll: 30

    - name: Start Sentry stack
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "/opt/sentry"
