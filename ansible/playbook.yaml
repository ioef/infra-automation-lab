---
- name: Deploy Self-Hosted Sentry
  hosts: sentry
  become: true

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        update_cache: true
        name:
          - ca-certificates
          - curl
          - git
        state: present

    - name: Create 16G swapfile if missing
      ansible.builtin.shell: |
        set -e
        fallocate -l 16G /swapfile
        chmod 600 /swapfile
        mkswap /swapfile
        swapon /swapfile
        echo '/swapfile none swap sw 0 0' >> /etc/fstab
      args:
        creates: /swapfile

    - name: Install Docker and Compose plugin
      ansible.builtin.shell: |
        set -e
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        chmod a+r /etc/apt/keyrings/docker.asc
        echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable" > /etc/apt/sources.list.d/docker.list
        apt-get update
        apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
        systemctl enable --now docker

    - name: Clone getsentry/self-hosted
      ansible.builtin.git:
        repo: "https://github.com/getsentry/self-hosted.git"
        dest: "/opt/sentry"
        version: "26.11.0"

    - name: Run Sentry installer
      ansible.builtin.command: ./install.sh --skip-user-creation --no-report-self-hosted-issues
      args:
        chdir: "/opt/sentry"
      async: 3600
      poll: 30

    - name: Start Sentry stack
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "/opt/sentry"